add_time:
  fields:
    device_id: &device
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: tellybox
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
          mode: box
set_unlimited_today:
  fields:
    device_id: *device
block_today:
  fields:
    device_id: *device
clear_overrides:
  fields:
    device_id: *device
stop_now:
  fields:
    device_id: *device
play_episode:
  fields:
    device_id: *device
    episode_id:
      required: true
      example: 4
      selector:
        number:
          min: 1
          mode: box
